<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <style>

        *{
            box-sizing: border-box;
        }

        html, body{
            margin: 0;
            padding: 0;
            background: #061A40;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .container-principale{
            display: flex;
            flex-direction: column;
            align-items: center;

        }

        .container-principale>h1{
            color: white;
            
        }

        .container-principale>.input-container>input{
            background: #003559;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 30px;
            outline: none;
            margin-right: 8px;
            
        }

        .container-principale>.input-container>input:focus{
            box-shadow: 0px 0px 12px #00a2aa;
        }

        .container-principale>.input-container>button{
            cursor: pointer;
            color: white;
            background: linear-gradient(90deg, #38AECC, #0090C1);
            border: none;
            height: 31px;
            border-radius: 31px;
            padding: 0 14px;

        }

        .container-principale>.input-container>button:hover{
            background: linear-gradient(-90deg, #38AECC, #0090C1);
        }

        .container-principale>.list-filter{
            margin: 20px 0;
            display: flex;
            gap: 20px;

        }

        .container-principale>.list-filter>div{
            cursor: pointer;
            color: white;
        }

        .container-principale>.list-filter>div:hover, .container-principale>.list-filter>div.active{
            text-decoration: underline #38AECC;
        }

        .container-principale>.list-elements{
            display: flex;
            flex-direction: column;
            gap:10px
        }

        .container-principale>.list-elements>.list-element{
            background: #084b63;
            display: flex;
            justify-items: start;
            align-items: center;
            border-radius: 8px;
            justify-content: space-between;
        }

        .container-principale>.list-elements>.list-element>.icon{

            margin: 16px;
            color: white;
            font-weight: bold;
        }

        .container-principale>.list-elements>.list-element>.text{
            color: white;
        }

        .container-principale>.list-elements>.list-element>.btn-delete{
            cursor: pointer;
            color: red;
            background: #0b607e;
            width: 30px;
            height: 30px;
            margin: 0 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container-principale>.list-elements>.list-element>.btn-delete:hover{
            background: #0e7498;
        }

        .container-principale>.list-elements>.list-element.hidden{
            display: none;
        }

    </style>
</head>
<body>

    <div class="container-principale">

        <h1>ToDo App</h1>

        <div class="input-container">
            <input type="text" placeholder="Scrivi cose" /> <button>+ Aggiungi</button>
            <select>
                <option value="imp">Importante</option>
                <option value="nonimp">Non Importante</option>
            </select>
        </div>

        <div class="list-filter">
            <div data-categoria="" class="active">All</div>
            <div data-categoria="imp">Importanti</div>
            <div data-categoria="nonimp">Non Importanti</div>
        </div>

        <div class="list-elements">


        </div>

    </div>

  
    <script>

        const listaGrafica = {
            $inputElement : null,
            $buttonElement : null,
            $listElements : null,
            $select : null,
            $filterCategories : null,
            init : function(){
                this.$inputElement = document.querySelector(".container-principale>.input-container>input");
                this.$buttonElement = document.querySelector(".container-principale>.input-container>button");
                this.$listElements = document.querySelector(".container-principale>.list-elements");
                this.$select = document.querySelector(".container-principale>.input-container>select");
                this.$filterCategories = document.querySelectorAll(".container-principale>.list-filter>div");

                this.$buttonElement.addEventListener("click", () => {
                    this.addElement();
                });

                for(const iterato of this.$filterCategories){
                    iterato.addEventListener("click", () => {
                        this._filter(iterato);
                    });
                }
                
            },

            addElement : function(){
                const messaggio = this.$inputElement.value;
                this.$inputElement.value = "";
                this.$listElements.appendChild(this._createElement(messaggio, this.$select.value));

            },

            _filter : function(buttoneCliccato){

                for(const iterato of this.$filterCategories){
                    iterato.classList.remove("active");
                }
                buttoneCliccato.classList.add("active");

                if(buttoneCliccato.getAttribute("data-categoria") == ""){
                    //all
                    for(const elem of this.$listElements.children){

                        elem.classList.remove("hidden");
                    }

                } else {
                    const cat = buttoneCliccato.getAttribute("data-categoria");
                    for(const elem of this.$listElements.children){
                        if(elem.getAttribute("data-categoria") != cat){
                            elem.classList.add("hidden");
                        } else elem.classList.remove("hidden");
                    }
                }

                

            },

            _createElement : function(msg, categoria){
                const template = `
                <div class="list-element" data-categoria="${categoria}">
                    <div class="icon">#</div>
                    <div class="text">${msg}</div>
                    <div class="btn-delete">X</div>
                </div>
                ` 
                const elementoAux = document.createElement("div");
                
                elementoAux.innerHTML = template;
                const newElement = elementoAux.children[0];
                newElement.querySelector(".btn-delete").addEventListener("click", () => {
                    newElement.remove();
                })

                return newElement;
            }


        };



        listaGrafica.init();

    </script>
    
</body>
</html>
